<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Tenicor I&amp;F Hub</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="kicker">Tenicor · Inventory &amp; Fulfillment</div><h1 id="h">I&amp;F Hub</h1><p class="sub" id="sub">Enter the team password to continue.</p></header>
<main id="app">
<form id="gate" class="panel" autocomplete="on">

<input id="pw" type="password" autocomplete="current-password" autofocus required class="input">

</form></main><footer>Internal use only.</footer>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(BLOB.salt),iterations:BLOB.it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(BLOB.iv)},key,d(BLOB.ct));return JSON.parse(new TextDecoder().decode(pt));}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null;
function render(){const app=document.getElementById('app'),id=location.hash.slice(1),a=DATA.artifacts.find(x=>x.id===id);
if(a){document.getElementById('h').textContent=a.title;document.getElementById('sub').textContent=a.summary;
app.innerHTML=`<a class="back" href="#">← I&amp;F Hub</a><a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">Open live view</a><div class="panel"><p class="note">Snapshot when added (11/16/26): ${esc(a.snapshot)} Numbers update live in the source.</p></div><p class="note">Opens in Claude. Claude doesn't allow these views to be embedded in other sites.</p>`;}
else{document.getElementById('h').textContent='I&F Hub';document.getElementById('sub').textContent='Internal tools and live views. Tap a card to open.';
app.innerHTML=DATA.artifacts.map(a=>`<a class="card" href="#${a.id}"><h2>${esc(a.title)}</h2><p>${esc(a.summary)}</p><span class="go">Open →</span></a>`).join('')+`<button class="btn secondary" id="lock" style="width:100%">Lock</button>`;
document.getElementById('lock').onclick=()=>{sessionStorage.removeItem('ifhub');location.hash='';location.reload();};}
window.scrollTo(0,0);}
async function tryPw(pw,silent){try{DATA=await unlock(pw);sessionStorage.setItem('ifhub',pw);render();window.onhashchange=render;return true;}
catch(e){if(!silent){const er=document.getElementById('err');er.hidden=false;document.getElementById('pw').value='';document.getElementById('pw').focus();}return false;}}
document.getElementById('gate').onsubmit=e=>{e.preventDefault();tryPw(document.getElementById('pw').value,false);};
const saved=sessionStorage.getItem('ifhub');if(saved)tryPw(saved,true);
</script></body></html>
